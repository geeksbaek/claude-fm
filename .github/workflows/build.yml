name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build app
        run: swift build -c release --product ClaudeFM

      - name: Render previews
        run: |
          mkdir -p .build/tools previews
          swiftc -O scripts/render/main.swift Sources/ClaudeFM/ClawdSprite.swift -o .build/tools/render
          .build/tools/render sheet previews/sheet.png

      - uses: actions/upload-artifact@v4
        with:
          name: previews
          path: previews
          if-no-files-found: error
