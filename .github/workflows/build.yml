name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build app
        run: swift build -c release --product ClaudeFM 2>&1 | tee build.log

      - name: Logic checks
        run: ./scripts/check.sh

      - name: Render previews
        run: |
          ./scripts/preview.sh previews
          mkdir -p .build/tools
          swiftc -O -module-name ClaudeFM scripts/render/main.swift $(ls Sources/ClaudeFM/*.swift | grep -v '/main.swift$') \
            -o .build/tools/render
          .build/tools/render sheet previews/sheet.png
          .build/tools/render icon previews/AppIcon.iconset

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: previews
          path: previews
          if-no-files-found: warn
